<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- 1. Кодировка - обязательно первой -->
  <meta charset="UTF-8">

  <!-- 2. Адаптивность под мобильные устройства -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 3. Заголовок вкладки (будет виден на скриншоте) -->
  <title>Шаблон HTML5</title>

  <!-- 4. SEO-метатеги (по теории) -->
  <meta name="description" content="Пример шаблона HTML5 документа с правильной структурой и метатегами для учебного задания">
  <meta name="author" content="Студент">
  <meta name="robots" content="index, follow">

  <!-- 5. Open Graph для красивых превью в соцсетях (по теории) -->
  <meta property="og:title" content="Шаблон HTML5">
  <meta property="og:description" content="Учебный пример HTML5 страницы с метатегами">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">

  <!-- 6. Цвет адресной строки для мобильных браузеров -->
  <meta name="theme-color" content="#2e7d32">

  <!-- 7. Фавикон (иконка на вкладке) – для полноты -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" type="image/svg+xml">
</head>
<body>
  <!-- Произвольный текст на русском, как сказано в задании -->
  <p>Привет, мир! Это моя первая HTML-страница, созданная по шаблону HTML5.</p>
</body>
</html>
